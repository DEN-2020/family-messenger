# Family Messenger — Hardened Nginx Reverse Proxy for Matrix Synapse (Phase 0 Local HTTPS)
# Listens on 127.0.0.1:8443 (avoids Windows HTTP.sys port 80 and SEO Studio port 8080/3000)

server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name localhost test.family.internal 127.0.0.1 192.168.2.122;

    ssl_certificate     /etc/nginx/ssl/family-messenger/server-fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/family-messenger/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Match Synapse max_upload_size
    client_max_body_size 50M;

    # Perimeter Block: Explicitly forbid any Matrix Federation or Key Server requests
    location ~ ^/_matrix/(federation|key) {
        default_type application/json;
        return 403 '{"errcode":"M_FORBIDDEN","error":"Federation is disabled on this private Family Messenger server"}';
    }

    # Well-known client discovery
    location = /.well-known/matrix/client {
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
        return 200 '{"m.homeserver":{"base_url":"https://192.168.2.122:8443"}}';
    }

    # Health check endpoint
    location = /health {
        proxy_pass http://127.0.0.1:8008/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Matrix Client-Server & Media APIs
    location ~ ^(/_matrix|/_synapse/client) {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
