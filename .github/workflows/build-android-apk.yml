name: Build Android Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Release APK (Flutter + Rust Vodozemac)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Rust toolchain with Android targets for flutter_vodozemac
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/pubspec.yaml') }}

      - name: Ensure Android SDK Platform 36 & NDK 28.2.13676358 are installed
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies & run static analysis
        run: |
          flutter --version
          cd packages/design_system && flutter pub get && flutter analyze
          cd ../messenger_core && flutter pub get && flutter analyze
          cd ../../apps/messenger && flutter pub get && flutter analyze
          flutter test test/widget_test.dart

      - name: Build Android Release APK
        working-directory: apps/messenger
        run: |
          flutter build apk --release --target-platform android-arm64,android-x64
          cp build/app/outputs/flutter-apk/app-release.apk ../../family-messenger-release.apk
          ls -lh ../../family-messenger-release.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: family-messenger-release-apk
          path: family-messenger-release.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release (v0.3.2-phase1)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.2-phase1
          name: "Family Messenger v0.3.2 (Voice Messages, Media Attachments & Modern Group UI)"
          body: |
            ## Family Messenger — Android Release APK (v0.3.2)
            - **Modern Messenger Terminology**: Transitioned terms from "семья" to universal modern messenger nomenclature ("Контакты", "Создать группу", "Участники", "Безопасное общение без ограничений").
            - **Voice Messages (Диктовка голоса)**: Dedicated microphone button in the message composer. Tap or hold to record audio with real-time timer, cancel button, and instant send.
            - **Native Voice Note Player**: High-fidelity in-chat voice bubble (`FamilyVoiceBubble`) with play/pause toggle, dynamic multi-bar audio waveform visualization, and playback progress tracking.
            - **Media & File Attachments**: Attachment sheet for sending Gallery Photos, Camera shots, Videos, and Documents (`.pdf`, `.docx`, etc.).
            - **End-to-End Encryption for All Media**: All photos, voice messages, videos, and files are encrypted client-side using Megolm AES-CTR-256 before upload to Synapse media repository. Decrypted on-the-fly in memory with zero leaks to insecure device storage.
            - **Full Virtual Keyboard Avoidance**: Message input remains comfortably anchored above virtual keyboards on all screen widths and device orientations.
            - **Visual QR Sharing**: High-contrast QR codes and one-click smart invitation links for effortless contact sharing.
          files: |
            family-messenger-release.apk
          prerelease: false
          make_latest: true
