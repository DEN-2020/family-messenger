# Family Messenger — Hardened Nginx Reverse Proxy for Matrix Synapse
# - 127.0.0.1:8440 -> Local HTTP backend for Tailscale Funnel (TLS 1.3 Let's Encrypt terminated by Tailscale Funnel on :443)
# - 8443 SSL       -> Local LAN/Fallback HTTPS listener

limit_req_zone $binary_remote_addr zone=matrix_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=matrix_api:10m rate=30r/s;

server {
    # 1. Local loopback listener for Tailscale Funnel (strictly 127.0.0.1 only)
    listen 127.0.0.1:8440;

    # 2. Local HTTPS listener
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;

    server_name asrock.tail56bf63.ts.net localhost test.family.internal 127.0.0.1 192.168.2.122;

    ssl_certificate     /etc/nginx/ssl/family-messenger/server-fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/family-messenger/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Hide Nginx version
    server_tokens off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Match Synapse max_upload_size (100 MB) and stream uploads without disk double-buffering
    client_max_body_size 100M;
    proxy_request_buffering off;

    # Perimeter Block 1: Explicitly forbid all Matrix Federation & Key Server requests
    location ~ ^/_matrix/(federation|key) {
        default_type application/json;
        return 403 '{"errcode":"M_FORBIDDEN","error":"Federation is disabled on this private Family Messenger server"}';
    }

    # Perimeter Block 2: Explicitly forbid all Synapse Administrative & Metrics APIs
    location ~ ^/_synapse/(admin|metrics) {
        default_type application/json;
        return 403 '{"errcode":"M_FORBIDDEN","error":"Administrative API is strictly disabled on external ingress"}';
    }

    # Well-known client discovery (returns public Tailscale Funnel HTTPS URL)
    location = /.well-known/matrix/client {
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
        return 200 '{"m.homeserver":{"base_url":"https://asrock.tail56bf63.ts.net"}}';
    }

    # Health check endpoint
    location = /health {
        proxy_pass http://127.0.0.1:8008/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Rate-limited Login endpoint
    location ~ ^/_matrix/client/(r0|v3)/login$ {
        limit_req zone=matrix_login burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
    }

    # Matrix Client-Server & Media APIs
    location ~ ^(/_matrix/client|/_matrix/media|/_synapse/client) {
        limit_req zone=matrix_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Default deny for all other paths
    location / {
        default_type application/json;
        return 404 '{"errcode":"M_UNRECOGNIZED","error":"Endpoint not exposed"}';
    }
}
