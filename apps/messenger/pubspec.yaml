name: family_messenger
description: Private End-to-End Encrypted Family Messenger (Android, Windows, iOS).
publish_to: 'none'
version: 0.3.2+5

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  design_system:
    path: ../../packages/design_system
  messenger_core:
    path: ../../packages/messenger_core
  flutter_vodozemac: ^0.8.1
  path_provider: ^2.1.5
  path: ^1.9.1
  qr_flutter: ^4.1.0
  file_picker: ^13.1.0
  image_picker: ^1.2.4
  record: ^7.1.2
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
